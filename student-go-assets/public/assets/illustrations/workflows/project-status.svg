<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 186" width="960" height="186" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Status proyek dari penyusunan sampai selesai</title><desc>1. Draf: Instansi menyusun masalah dan belum mempublikasikannya. 2. Dibuka: Mahasiswa dapat melihat proyek dan mengirim lamaran. 3. Berjalan: Lamaran diterima dan proyek dipantau instansi. 4. Selesai: Instansi memberi review untuk mahasiswa yang terlibat.</desc><style>.ink{fill:var(--sg-ink,#1B2236)}.sub{fill:var(--sg-ink-2,#4B5262)}.mut{fill:var(--sg-ink-3,#667085)}.rt{fill:none;stroke:var(--sg-brand,#405080);stroke-width:2;stroke-linecap:round}.nb{fill:var(--sg-brand,#405080)}.ring{fill:var(--sg-paper,#fff);stroke:var(--sg-brand,#405080);stroke-width:2}.dst{fill:var(--sg-accent,#A4552B)}text{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.n{font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}.h{font-size:15px;font-weight:600}.p{font-size:13px;font-weight:400}</style><path class="rt" d="M39.0 66H707.0"/><text class="n mut" x="24.0" y="42">01</text><text class="h ink" x="24.0" y="104">Draf</text><text class="p sub" x="24.0" y="126">Instansi menyusun masalah</text><text class="p sub" x="24.0" y="144">dan belum</text><text class="p sub" x="24.0" y="162">mempublikasikannya.</text><text class="n mut" x="252.0" y="42">02</text><text class="h ink" x="252.0" y="104">Dibuka</text><text class="p sub" x="252.0" y="126">Mahasiswa dapat melihat</text><text class="p sub" x="252.0" y="144">proyek dan mengirim</text><text class="p sub" x="252.0" y="162">lamaran.</text><text class="n mut" x="480.0" y="42">03</text><text class="h ink" x="480.0" y="104">Berjalan</text><text class="p sub" x="480.0" y="126">Lamaran diterima dan proyek</text><text class="p sub" x="480.0" y="144">dipantau instansi.</text><text class="n mut" x="708.0" y="42">04</text><text class="h ink" x="708.0" y="104">Selesai</text><text class="p sub" x="708.0" y="126">Instansi memberi review</text><text class="p sub" x="708.0" y="144">untuk mahasiswa yang</text><text class="p sub" x="708.0" y="162">terlibat.</text><circle class="ring" cx="31.0" cy="66" r="7"/><circle class="nb" cx="259.0" cy="66" r="4.5"/><circle class="nb" cx="487.0" cy="66" r="4.5"/><circle class="dst" cx="715.0" cy="66" r="7"/></svg>
