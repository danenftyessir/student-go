<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" width="960" height="222" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Alur mahasiswa di Student Go</title><desc>1. Jelajahi proyek: Saring menurut provinsi, SDG, kesulitan, dan durasi, atau buka peta. 2. Kirim lamaran: Tulis motivasi minimal 100 karakter dan lampirkan berkas yang diminta. 3. Pantau tinjauan: Lihat status lamaran dan linimasanya di halaman Lamaran. 4. Jalankan proyek: Lamaran yang diterima tampil di halaman Proyek Saya. 5. Bangun portofolio: Hasil dan penilaian instansi tampil di profil dan portofolio publik.</desc><style>.ink{fill:var(--sg-ink,#1B2236)}.sub{fill:var(--sg-ink-2,#4B5262)}.mut{fill:var(--sg-ink-3,#667085)}.rt{fill:none;stroke:var(--sg-brand,#405080);stroke-width:2;stroke-linecap:round}.nb{fill:var(--sg-brand,#405080)}.ring{fill:var(--sg-paper,#fff);stroke:var(--sg-brand,#405080);stroke-width:2}.dst{fill:var(--sg-accent,#A4552B)}text{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.n{font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}.h{font-size:15px;font-weight:600}.p{font-size:13px;font-weight:400}</style><path class="rt" d="M39.0 66H752.6"/><text class="n mut" x="24.0" y="42">01</text><text class="h ink" x="24.0" y="104">Jelajahi proyek</text><text class="p sub" x="24.0" y="126">Saring menurut</text><text class="p sub" x="24.0" y="144">provinsi, SDG,</text><text class="p sub" x="24.0" y="162">kesulitan, dan</text><text class="p sub" x="24.0" y="180">durasi, atau buka</text><text class="p sub" x="24.0" y="198">peta.</text><text class="n mut" x="206.4" y="42">02</text><text class="h ink" x="206.4" y="104">Kirim lamaran</text><text class="p sub" x="206.4" y="126">Tulis motivasi</text><text class="p sub" x="206.4" y="144">minimal 100 karakter</text><text class="p sub" x="206.4" y="162">dan lampirkan berkas</text><text class="p sub" x="206.4" y="180">yang diminta.</text><text class="n mut" x="388.8" y="42">03</text><text class="h ink" x="388.8" y="104">Pantau tinjauan</text><text class="p sub" x="388.8" y="126">Lihat status lamaran</text><text class="p sub" x="388.8" y="144">dan linimasanya di</text><text class="p sub" x="388.8" y="162">halaman Lamaran.</text><text class="n mut" x="571.2" y="42">04</text><text class="h ink" x="571.2" y="104">Jalankan proyek</text><text class="p sub" x="571.2" y="126">Lamaran yang diterima</text><text class="p sub" x="571.2" y="144">tampil di halaman</text><text class="p sub" x="571.2" y="162">Proyek Saya.</text><text class="n mut" x="753.6" y="42">05</text><text class="h ink" x="753.6" y="104">Bangun portofolio</text><text class="p sub" x="753.6" y="126">Hasil dan penilaian</text><text class="p sub" x="753.6" y="144">instansi tampil di</text><text class="p sub" x="753.6" y="162">profil dan portofolio</text><text class="p sub" x="753.6" y="180">publik.</text><circle class="ring" cx="31.0" cy="66" r="7"/><circle class="nb" cx="213.4" cy="66" r="4.5"/><circle class="nb" cx="395.8" cy="66" r="4.5"/><circle class="nb" cx="578.2" cy="66" r="4.5"/><circle class="dst" cx="760.6" cy="66" r="7"/></svg>
