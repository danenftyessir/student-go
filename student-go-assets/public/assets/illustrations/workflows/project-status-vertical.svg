<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" width="360" height="430" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Status proyek dari penyusunan sampai selesai</title><desc>1. Draf: Instansi menyusun masalah dan belum mempublikasikannya. 2. Dibuka: Mahasiswa dapat melihat proyek dan mengirim lamaran. 3. Berjalan: Lamaran diterima dan proyek dipantau instansi. 4. Selesai: Instansi memberi review untuk mahasiswa yang terlibat.</desc><style>.ink{fill:var(--sg-ink,#1B2236)}.sub{fill:var(--sg-ink-2,#4B5262)}.mut{fill:var(--sg-ink-3,#667085)}.rt{fill:none;stroke:var(--sg-brand,#405080);stroke-width:2;stroke-linecap:round}.nb{fill:var(--sg-brand,#405080)}.ring{fill:var(--sg-paper,#fff);stroke:var(--sg-brand,#405080);stroke-width:2}.dst{fill:var(--sg-accent,#A4552B)}text{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.n{font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}.h{font-size:15px;font-weight:600}.p{font-size:13px;font-weight:400}</style><path class="rt" d="M18 42V344"/><text class="n mut" x="44" y="24">01</text><text class="h ink" x="44" y="40">Draf</text><text class="p sub" x="44" y="62">Instansi menyusun masalah dan belum</text><text class="p sub" x="44" y="80">mempublikasikannya.</text><text class="n mut" x="44" y="130">02</text><text class="h ink" x="44" y="146">Dibuka</text><text class="p sub" x="44" y="168">Mahasiswa dapat melihat proyek dan</text><text class="p sub" x="44" y="186">mengirim lamaran.</text><text class="n mut" x="44" y="236">03</text><text class="h ink" x="44" y="252">Berjalan</text><text class="p sub" x="44" y="274">Lamaran diterima dan proyek dipantau</text><text class="p sub" x="44" y="292">instansi.</text><text class="n mut" x="44" y="342">04</text><text class="h ink" x="44" y="358">Selesai</text><text class="p sub" x="44" y="380">Instansi memberi review untuk mahasiswa</text><text class="p sub" x="44" y="398">yang terlibat.</text><circle class="ring" cx="18" cy="34" r="7"/><circle class="nb" cx="18" cy="140" r="4.5"/><circle class="nb" cx="18" cy="246" r="4.5"/><circle class="dst" cx="18" cy="352" r="7"/></svg>
