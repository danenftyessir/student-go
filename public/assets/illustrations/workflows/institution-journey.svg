<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 204" width="960" height="204" role="img"><title>Alur instansi di Student Go</title><desc>1. Daftar dan verifikasi: Unggah dokumen verifikasi agar instansi dapat dipercaya mahasiswa. 2. Publikasikan masalah: Susun masalah KKN: lokasi, SDG, kuota, tenggat, dan persyaratan. 3. Tinjau pelamar: Terima atau tolak lamaran di halaman Pelamar. 4. Pantau proyek: Ikuti proyek yang sedang berjalan bersama mahasiswa. 5. Beri review: Nilai kontribusi mahasiswa setelah proyek selesai.</desc><style>.ink{fill:var(--sg-ink,#1B2236)}.sub{fill:var(--sg-ink-2,#4B5262)}.mut{fill:var(--sg-ink-3,#667085)}.rt{fill:none;stroke:var(--sg-brand,#405080);stroke-width:2;stroke-linecap:round}.nb{fill:var(--sg-brand,#405080)}.ring{fill:var(--sg-paper,#fff);stroke:var(--sg-brand,#405080);stroke-width:2}.dst{fill:var(--sg-accent,#A4552B)}text{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.n{font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}.h{font-size:15px;font-weight:600}.p{font-size:13px;font-weight:400}</style><path class="rt" d="M39.0 66H752.6"/><text class="n mut" x="24.0" y="42">01</text><text class="h ink" x="24.0" y="104">Daftar dan verifikasi</text><text class="p sub" x="24.0" y="126">Unggah dokumen</text><text class="p sub" x="24.0" y="144">verifikasi agar</text><text class="p sub" x="24.0" y="162">instansi dapat</text><text class="p sub" x="24.0" y="180">dipercaya mahasiswa.</text><text class="n mut" x="206.4" y="42">02</text><text class="h ink" x="206.4" y="104">Publikasikan masalah</text><text class="p sub" x="206.4" y="126">Susun masalah KKN:</text><text class="p sub" x="206.4" y="144">lokasi, SDG, kuota,</text><text class="p sub" x="206.4" y="162">tenggat, dan</text><text class="p sub" x="206.4" y="180">persyaratan.</text><text class="n mut" x="388.8" y="42">03</text><text class="h ink" x="388.8" y="104">Tinjau pelamar</text><text class="p sub" x="388.8" y="126">Terima atau tolak</text><text class="p sub" x="388.8" y="144">lamaran di halaman</text><text class="p sub" x="388.8" y="162">Pelamar.</text><text class="n mut" x="571.2" y="42">04</text><text class="h ink" x="571.2" y="104">Pantau proyek</text><text class="p sub" x="571.2" y="126">Ikuti proyek yang</text><text class="p sub" x="571.2" y="144">sedang berjalan</text><text class="p sub" x="571.2" y="162">bersama mahasiswa.</text><text class="n mut" x="753.6" y="42">05</text><text class="h ink" x="753.6" y="104">Beri review</text><text class="p sub" x="753.6" y="126">Nilai kontribusi</text><text class="p sub" x="753.6" y="144">mahasiswa setelah</text><text class="p sub" x="753.6" y="162">proyek selesai.</text><circle class="ring" cx="31.0" cy="66" r="7"/><circle class="nb" cx="213.4" cy="66" r="4.5"/><circle class="nb" cx="395.8" cy="66" r="4.5"/><circle class="nb" cx="578.2" cy="66" r="4.5"/><circle class="dst" cx="760.6" cy="66" r="7"/></svg>
