<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" width="360" height="536" role="img"><title>Alur mahasiswa di Student Go</title><desc>1. Jelajahi proyek: Saring menurut provinsi, SDG, kesulitan, dan durasi, atau buka peta. 2. Kirim lamaran: Tulis motivasi minimal 100 karakter dan lampirkan berkas yang diminta. 3. Pantau tinjauan: Lihat status lamaran dan linimasanya di halaman Lamaran. 4. Jalankan proyek: Lamaran yang diterima tampil di halaman Proyek Saya. 5. Bangun portofolio: Hasil dan penilaian instansi tampil di profil dan portofolio publik.</desc><style>.ink{fill:var(--sg-ink,#1B2236)}.sub{fill:var(--sg-ink-2,#4B5262)}.mut{fill:var(--sg-ink-3,#667085)}.rt{fill:none;stroke:var(--sg-brand,#405080);stroke-width:2;stroke-linecap:round}.nb{fill:var(--sg-brand,#405080)}.ring{fill:var(--sg-paper,#fff);stroke:var(--sg-brand,#405080);stroke-width:2}.dst{fill:var(--sg-accent,#A4552B)}text{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.n{font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}.h{font-size:15px;font-weight:600}.p{font-size:13px;font-weight:400}</style><path class="rt" d="M18 42V450"/><text class="n mut" x="44" y="24">01</text><text class="h ink" x="44" y="40">Jelajahi proyek</text><text class="p sub" x="44" y="62">Saring menurut provinsi, SDG, kesulitan,</text><text class="p sub" x="44" y="80">dan durasi, atau buka peta.</text><text class="n mut" x="44" y="130">02</text><text class="h ink" x="44" y="146">Kirim lamaran</text><text class="p sub" x="44" y="168">Tulis motivasi minimal 100 karakter dan</text><text class="p sub" x="44" y="186">lampirkan berkas yang diminta.</text><text class="n mut" x="44" y="236">03</text><text class="h ink" x="44" y="252">Pantau tinjauan</text><text class="p sub" x="44" y="274">Lihat status lamaran dan linimasanya di</text><text class="p sub" x="44" y="292">halaman Lamaran.</text><text class="n mut" x="44" y="342">04</text><text class="h ink" x="44" y="358">Jalankan proyek</text><text class="p sub" x="44" y="380">Lamaran yang diterima tampil di halaman</text><text class="p sub" x="44" y="398">Proyek Saya.</text><text class="n mut" x="44" y="448">05</text><text class="h ink" x="44" y="464">Bangun portofolio</text><text class="p sub" x="44" y="486">Hasil dan penilaian instansi tampil di</text><text class="p sub" x="44" y="504">profil dan portofolio publik.</text><circle class="ring" cx="18" cy="34" r="7"/><circle class="nb" cx="18" cy="140" r="4.5"/><circle class="nb" cx="18" cy="246" r="4.5"/><circle class="nb" cx="18" cy="352" r="4.5"/><circle class="dst" cx="18" cy="458" r="7"/></svg>
