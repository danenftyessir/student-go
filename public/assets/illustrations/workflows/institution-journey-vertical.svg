<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" width="360" height="536" role="img"><title>Alur instansi di Student Go</title><desc>1. Daftar dan verifikasi: Unggah dokumen verifikasi agar instansi dapat dipercaya mahasiswa. 2. Publikasikan masalah: Susun masalah KKN: lokasi, SDG, kuota, tenggat, dan persyaratan. 3. Tinjau pelamar: Terima atau tolak lamaran di halaman Pelamar. 4. Pantau proyek: Ikuti proyek yang sedang berjalan bersama mahasiswa. 5. Beri review: Nilai kontribusi mahasiswa setelah proyek selesai.</desc><style>.ink{fill:var(--sg-ink,#1B2236)}.sub{fill:var(--sg-ink-2,#4B5262)}.mut{fill:var(--sg-ink-3,#667085)}.rt{fill:none;stroke:var(--sg-brand,#405080);stroke-width:2;stroke-linecap:round}.nb{fill:var(--sg-brand,#405080)}.ring{fill:var(--sg-paper,#fff);stroke:var(--sg-brand,#405080);stroke-width:2}.dst{fill:var(--sg-accent,#A4552B)}text{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.n{font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}.h{font-size:15px;font-weight:600}.p{font-size:13px;font-weight:400}</style><path class="rt" d="M18 42V450"/><text class="n mut" x="44" y="24">01</text><text class="h ink" x="44" y="40">Daftar dan verifikasi</text><text class="p sub" x="44" y="62">Unggah dokumen verifikasi agar instansi</text><text class="p sub" x="44" y="80">dapat dipercaya mahasiswa.</text><text class="n mut" x="44" y="130">02</text><text class="h ink" x="44" y="146">Publikasikan masalah</text><text class="p sub" x="44" y="168">Susun masalah KKN: lokasi, SDG, kuota,</text><text class="p sub" x="44" y="186">tenggat, dan persyaratan.</text><text class="n mut" x="44" y="236">03</text><text class="h ink" x="44" y="252">Tinjau pelamar</text><text class="p sub" x="44" y="274">Terima atau tolak lamaran di halaman</text><text class="p sub" x="44" y="292">Pelamar.</text><text class="n mut" x="44" y="342">04</text><text class="h ink" x="44" y="358">Pantau proyek</text><text class="p sub" x="44" y="380">Ikuti proyek yang sedang berjalan</text><text class="p sub" x="44" y="398">bersama mahasiswa.</text><text class="n mut" x="44" y="448">05</text><text class="h ink" x="44" y="464">Beri review</text><text class="p sub" x="44" y="486">Nilai kontribusi mahasiswa setelah</text><text class="p sub" x="44" y="504">proyek selesai.</text><circle class="ring" cx="18" cy="34" r="7"/><circle class="nb" cx="18" cy="140" r="4.5"/><circle class="nb" cx="18" cy="246" r="4.5"/><circle class="nb" cx="18" cy="352" r="4.5"/><circle class="dst" cx="18" cy="458" r="7"/></svg>
