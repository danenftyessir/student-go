<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 186" width="960" height="186" role="img"><title>Alur perusahaan di Student Go</title><desc>1. Cari talenta: Telusuri mahasiswa dengan pencarian dan filter. 2. Simpan dan bandingkan: Kumpulkan kandidat ke folder tersimpan lalu bandingkan. 3. Terbitkan lowongan: Susun lowongan lewat formulir lima langkah. 4. Kelola pelamar: Pantau pelamar per tahap di halaman Lamaran.</desc><style>.ink{fill:var(--sg-ink,#1B2236)}.sub{fill:var(--sg-ink-2,#4B5262)}.mut{fill:var(--sg-ink-3,#667085)}.rt{fill:none;stroke:var(--sg-brand,#405080);stroke-width:2;stroke-linecap:round}.nb{fill:var(--sg-brand,#405080)}.ring{fill:var(--sg-paper,#fff);stroke:var(--sg-brand,#405080);stroke-width:2}.dst{fill:var(--sg-accent,#A4552B)}text{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.n{font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}.h{font-size:15px;font-weight:600}.p{font-size:13px;font-weight:400}</style><path class="rt" d="M39.0 66H707.0"/><text class="n mut" x="24.0" y="42">01</text><text class="h ink" x="24.0" y="104">Cari talenta</text><text class="p sub" x="24.0" y="126">Telusuri mahasiswa dengan</text><text class="p sub" x="24.0" y="144">pencarian dan filter.</text><text class="n mut" x="252.0" y="42">02</text><text class="h ink" x="252.0" y="104">Simpan dan bandingkan</text><text class="p sub" x="252.0" y="126">Kumpulkan kandidat ke</text><text class="p sub" x="252.0" y="144">folder tersimpan lalu</text><text class="p sub" x="252.0" y="162">bandingkan.</text><text class="n mut" x="480.0" y="42">03</text><text class="h ink" x="480.0" y="104">Terbitkan lowongan</text><text class="p sub" x="480.0" y="126">Susun lowongan lewat</text><text class="p sub" x="480.0" y="144">formulir lima langkah.</text><text class="n mut" x="708.0" y="42">04</text><text class="h ink" x="708.0" y="104">Kelola pelamar</text><text class="p sub" x="708.0" y="126">Pantau pelamar per tahap di</text><text class="p sub" x="708.0" y="144">halaman Lamaran.</text><circle class="ring" cx="31.0" cy="66" r="7"/><circle class="nb" cx="259.0" cy="66" r="4.5"/><circle class="nb" cx="487.0" cy="66" r="4.5"/><circle class="dst" cx="715.0" cy="66" r="7"/></svg>
