<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" width="360" height="430" role="img"><title>Alur perusahaan di Student Go</title><desc>1. Cari talenta: Telusuri mahasiswa dengan pencarian dan filter. 2. Simpan dan bandingkan: Kumpulkan kandidat ke folder tersimpan lalu bandingkan. 3. Terbitkan lowongan: Susun lowongan lewat formulir lima langkah. 4. Kelola pelamar: Pantau pelamar per tahap di halaman Lamaran.</desc><style>.ink{fill:var(--sg-ink,#1B2236)}.sub{fill:var(--sg-ink-2,#4B5262)}.mut{fill:var(--sg-ink-3,#667085)}.rt{fill:none;stroke:var(--sg-brand,#405080);stroke-width:2;stroke-linecap:round}.nb{fill:var(--sg-brand,#405080)}.ring{fill:var(--sg-paper,#fff);stroke:var(--sg-brand,#405080);stroke-width:2}.dst{fill:var(--sg-accent,#A4552B)}text{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.n{font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}.h{font-size:15px;font-weight:600}.p{font-size:13px;font-weight:400}</style><path class="rt" d="M18 42V344"/><text class="n mut" x="44" y="24">01</text><text class="h ink" x="44" y="40">Cari talenta</text><text class="p sub" x="44" y="62">Telusuri mahasiswa dengan pencarian dan</text><text class="p sub" x="44" y="80">filter.</text><text class="n mut" x="44" y="130">02</text><text class="h ink" x="44" y="146">Simpan dan bandingkan</text><text class="p sub" x="44" y="168">Kumpulkan kandidat ke folder tersimpan</text><text class="p sub" x="44" y="186">lalu bandingkan.</text><text class="n mut" x="44" y="236">03</text><text class="h ink" x="44" y="252">Terbitkan lowongan</text><text class="p sub" x="44" y="274">Susun lowongan lewat formulir lima</text><text class="p sub" x="44" y="292">langkah.</text><text class="n mut" x="44" y="342">04</text><text class="h ink" x="44" y="358">Kelola pelamar</text><text class="p sub" x="44" y="380">Pantau pelamar per tahap di halaman</text><text class="p sub" x="44" y="398">Lamaran.</text><circle class="ring" cx="18" cy="34" r="7"/><circle class="nb" cx="18" cy="140" r="4.5"/><circle class="nb" cx="18" cy="246" r="4.5"/><circle class="dst" cx="18" cy="352" r="7"/></svg>
